name: Collect public GeM tenders
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Listing collection seconds for this run
        default: '600'
        required: false
      pdf_seconds:
        description: PDF processing seconds for this run
        default: '100'
        required: false
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: gem-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and PDF reader
        run: |
          pip install playwright==1.64.1 pdfplumber==0.11.9
          python -m playwright install --with-deps chromium
      - name: Collect real public bids
        working-directory: app
        env:
          COLLECT_SECONDS: ${{ inputs.seconds || '600' }}
          PDF_SECONDS: ${{ inputs.pdf_seconds || '100' }}
        run: python collector.py --data-dir ../data --seconds "$COLLECT_SECONDS" --pdf-seconds "$PDF_SECONDS"
      - name: Publish checkpoint and dataset
        if: always()
        working-directory: data
        run: |
          git config user.name 'TenderBot collector'
          git config user.email 'tenderbot@users.noreply.github.com'
          git add records index.json collector.json state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified public GeM collection'
            git push origin HEAD:data
          fi
